{% if page.has_previous %}
<li class="page-item cursor-pointer">
    <a class="page-link" data-page="{{ page.previous_page_number }}"
    onClick="replaceFeedbacks(this)">Назад</a>
</li>
{% endif %}
{% if page.has_next %}
<li class="page-item cursor-pointer">
    <a class="page-link" data-page="{{ page.next_page_number }}"
    onClick="replaceFeedbacks(this)">Далее</a>
</li>
{% endif %}
