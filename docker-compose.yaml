version: '3.7'

services:
  db:
    image: postgres:14
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    expose:
      - "5432"
    env_file:
      - ./.env
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    expose:
      - "6379"
  web:
    image: flowhack/sochno-auto:latest
    restart: always
    volumes:
      - ./staticfiles:/code/staticfiles/
      - ./media:/code/media/
      - ./dumps:/code/dumps/
    depends_on:
      - db
      - redis
    env_file:
      - ./.env
  nginx:
    image: nginx:1.19.3
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./staticfiles:/var/html/static/
      - ./media:/var/html/media/
    depends_on:
      - web

volumes:
  postgres_data:
  redis_data: