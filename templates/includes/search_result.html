<a href="{% url 'cars:car' car.slug %}" class="search-result-item">
     <div class="d-flex gap-2">
        <img style="border-radius: 15px; height: 64px" src="{{ MEDIA_URL }}{{ car.car_images.first.image.url }}">
        <div>
        <div class="search-result-title">
            {{ car.brand }} {{ car.model }}{% if car.engine_capacity %} {{ car.engine_capacity }}{% endif %} {{ car.type_transmission|upper }}
        </div>
        <div class="search-result-meta">
            {{ car.year_release }} | {{ car.mileage }}
        </div>
        </div>
    </div>
</a>
