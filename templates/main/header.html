{% load static%}
<header class="sochno-header">
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="{% url 'homepage:index' %}">
                <div class="sochno-logo">
                    <img class="sochno-logo-icon" src="{% static 'favicon.png' %}">
                    <span>СОЧНО АВТО</span>
                </div>
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain" 
                    aria-controls="navbarMain" aria-expanded="false" aria-label="Меню">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarMain">
                <ul class="navbar-nav mx-auto align-items-center gap-2">
                    <li class="nav-item">
                        <a class="nav-link nav-link-custom" href="{% url 'cars:category' %}">Категории</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link nav-link-custom" href="#">Контакты</a>
                    </li>
                    <li class="nav-item">
                        <div class="search-wrapper">
                            <input type="text" 
                                   id="searchInput" 
                                   class="form-control search-input" 
                                   placeholder="Поиск автомобилей..."
                                   autocomplete="off"
                                   data-url-offer="{% url 'cars:car' 'auto-offer-slug' %}">
                            <div id="searchResults" class="search-results d-none" data-offer-base-url="/offer/"></div>
                        </div>
                    </li>
                </ul>
                <div class="d-flex align-items-center mt-3 mt-lg-0 navbar-contact-wrap">
                    <a href="#contact" class="btn btn-contact">Связаться с нами</a>
                </div>
            </div>
        </div>
    </nav>
</header>
