<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock title %} | СОЧНО АВТО</title>
    <!--[if mso]>
    <style type="text/css">
        table {border-collapse: collapse;}
        .fallback-font {font-family: Arial, sans-serif;}
    </style>
    <![endif]-->
    <style type="text/css">
        body {margin: 0; padding: 0; background-color: #f4f4f4;}
        .email-wrapper {width: 100%; background-color: #f4f4f4; padding: 20px 0;}
        .email-container {max-width: 600px; margin: 0 auto; background-color: #1e1e1e; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);}
        .email-header {background: linear-gradient(135deg, #2c3e50, #34495e); padding: 25px 20px;}
        .header-content {display: inline-block; vertical-align: middle;}
        .company-logo {border-radius: 15px;}
        .company-name {color: #ffffff; font-size: 22px; font-family: Arial, Helvetica, sans-serif; margin: 0; line-height: 40px;}
        .email-body {padding: 30px 25px; color: #e0e0e0; font-family: Arial, Helvetica, sans-serif; font-size: 16px; line-height: 1.6;}
        .text-center {text-align: center;}
        .mb-3 {margin-bottom: 15px;}
        .mb-4 {margin-bottom: 20px;}
        .mt-4 {margin-top: 20px;}
        .lead-info {max-width: 400px; margin: 0 auto; text-align: left;}
        .lead-info td {border-bottom: 1px solid #3a3a3a;}
        .btn-primary {display: inline-block; padding: 12px 30px; font-size: 16px; font-weight: bold; text-align: center; 
                       text-decoration: none; background-color: #3498db; border: 2px solid #3498db; border-radius: 6px; 
                       color: #ffffff; font-family: Arial, Helvetica, sans-serif;}
        .btn-primary:hover {background-color: #2980b9; border-color: #2980b9;}
        .link-box {word-break: break-all; font-family: 'Courier New', monospace; background-color: #2d2d2d; 
                    padding: 12px 16px; border-left: 4px solid #3498db; border-radius: 4px; margin: 15px 0;}
        .footer {text-align: center; padding: 20px; background-color: #2c2c2c; color: #aaa; font-size: 14px; 
                 font-family: Arial, Helvetica, sans-serif; line-height: 1.4;}
        @media only screen and (max-width: 640px) {
            .email-container {width: 100% !important; margin: 0 !important; border-radius: 8px;}
            .email-body {padding: 20px 15px !important;}
            .company-name {font-size: 20px !important;}
        }
    </style>
</head>
<body>
    <div class="email-wrapper">
        <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" bgcolor="#f4f4f4">
            <tr>
                <td align="center" style="padding: 20px 10px;">
                    <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="600" class="email-container" 
                           style="max-width: 600px; margin: 0 auto; background-color: #1e1e1e; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);">
                        <!-- Header -->
                        <tr>
                            <td class="email-header" style="padding: 25px 20px; background: linear-gradient(135deg, #2c3e50, #34495e); border-radius: 12px 12px 0 0;">
                                <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
                                    <tr>
                                        <td align="center">
                                            <img src="cid:{{ cid }}" alt="Логотип СОЧНО АВТО" width="40" height="40" 
                                                 style="width: 40px; height: 40px; border-radius: 15px; display: block;">
                                        </td>
                                    </tr>
                                    <tr>
                                        <td align="center" style="padding-top: 10px;">
                                            <p class="company-name" style="color: #ffffff; font-size: 22px; font-family: Arial, Helvetica, sans-serif; margin: 0;">СОЧНО АВТО</p>
                                        </td>
                                    </tr>
                                </table>
                            </td>
                        </tr>
                        <!-- Body -->
                        <tr>
                            <td class="email-body" style="padding: 30px 25px; background-color: #1e1e1e; color: #e0e0e0; font-family: Arial, Helvetica, sans-serif; font-size: 16px; line-height: 1.6;">
                                {% block email_body %}
                                {% endblock email_body %}
                                <p style="margin: 30px 0 0 0;">С уважением,<br>Команда СОЧНО АВТО</p>
                            </td>
                        </tr>
                        <!-- Footer -->
                        <tr>
                            <td class="footer" style="padding: 20px; background-color: #2c2c2c; color: #aaa; font-size: 14px; font-family: Arial, Helvetica, sans-serif; line-height: 1.4; text-align: center; border-radius: 0 0 12px 12px;">
                                <p style="margin: 0 0 8px 0;">&copy; 2024–{{ now|date:"Y" }} ООО «СОЧНО АВТО». Все права защищены.</p>
                                {% block extra_footer %}{% endblock extra_footer %}
                                <p style="margin: 8px 0 0 0;">Письмо отправлено автоматически, не отвечайте на него</p>
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>
        </table>
    </div>
</body>
</html>
