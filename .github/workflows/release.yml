name: CI - Release

on:
  push:
    branches:
      - release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  flake8:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 
      uses: actions/setup-python@v5
      with:
        python-version: 3.12

    - name: Install dependencies
      run: | 
        python -m pip install --upgrade pip 
        pip install flake8 pep8-naming flake8-broken-line flake8-return flake8-isort

    - name: Test with flake8
      run: |
        python -m flake8

  django_tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 
      uses: actions/setup-python@v5
      with:
        python-version: 3.12

    - name: Install dependencies
      run: | 
        python -m pip install --upgrade pip 
        pip install -r requirements.txt 

    - name: Run Django tests
      run: |
        export DJANGO_SECRET_KEY=test_secret_key_for_github_actions
        export DEBUG=False
        export DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1
        export DJANGO_DB_NAME=db.sqlite3
        export AVITO_USER_ID=test
        export EMAIL_HOST=localhost
        export EMAIL_PORT=587
        export EMAIL_HOST_USER=test@test.com
        export EMAIL_HOST_PASSWORD=test
        export EMAIL_USE_TLS=False
        export EMAIL_USE_SSL=False
        export EMAIL_TIMEOUT=30
        export EMAIL_FOR=test@test.com
        python manage.py test
  
  build_and_push_to_docker_hub:
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-latest
    needs: [flake8, django_tests]
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker 
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD}}

      - name: Push to Docker Hub
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/sochno-auto-release:latest

  send_message:
    runs-on: ubuntu-latest
    needs: build_and_push_to_docker_hub
    steps:
      - name: send message
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            ✅ Release push Docker успешно выполнен!
            Коммит: ${{ github.sha }}
            Автор: ${{ github.actor }}
